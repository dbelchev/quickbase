packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": ^20.19.43
  eslint: ^9.39.5
  turbo: ^2.11.5
  typescript: ^5.9.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.2
  zod: ^4.6.5

allowBuilds:
  "@ax-llm/ax": false
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/fireworks@3.0.71'
  - '@ai-sdk/openai-compatible@3.0.68'
  - '@ai-sdk/provider-utils@5.0.59'
  - '@ai-sdk/provider@4.0.27'
